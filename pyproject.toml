[project]
name = "nhs-personalised-care"
version = "1.0.0"
description = "NHS Personalised Care System"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask==2.3.3",
    "Flask-Cors==4.0.1",
    "Flask-SocketIO==5.3.6",
    "python-socketio==5.11.0",
    "Werkzeug==2.3.8",
    "pandas==2.0.3",
    "numpy==1.24.4",
    "scikit-learn==1.3.2",
    "Pillow==10.1.0",
    "eventlet==0.33.3",
]

[tool.vercel]
entrypoint = "app:app"