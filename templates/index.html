<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#005EB8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>NHS Personalised Care</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    
    <style>
        /* ... your existing styles ... */
        /* Add this to your styles */
        
        /* PWA Install Banner */
        .install-banner {
            display: none;
            position: fixed;
            bottom: 80px;
            left: 16px;
            right: 16px;
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            z-index: 1000;
            animation: slideUpBanner 0.4s ease;
            border: 1px solid #E8ECF0;
        }
        
        .install-banner.show {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        @keyframes slideUpBanner {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .install-banner .icon {
            font-size: 32px;
            flex-shrink: 0;
        }
        
        .install-banner .content {
            flex: 1;
        }
        
        .install-banner .content h4 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }
        
        .install-banner .content p {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 2px;
        }
        
        .install-banner .btn-install {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        .install-banner .btn-install:active {
            transform: scale(0.95);
        }
        
        .install-banner .btn-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-light);
            padding: 4px 8px;
        }
        
        @media (max-width: 480px) {
            .install-banner {
                bottom: 70px;
                padding: 12px 16px;
            }
            .install-banner .icon { font-size: 24px; }
            .install-banner .content h4 { font-size: 14px; }
            .install-banner .content p { font-size: 12px; }
            .install-banner .btn-install { padding: 6px 14px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <!-- ========== INSTALL BANNER ========== -->
    <div class="install-banner" id="installBanner">
        <span class="icon">📱</span>
        <div class="content">
            <h4>Install NHS Personalised Care</h4>
            <p>Get offline access and quick launch from your home screen</p>
        </div>
        <button class="btn-install" id="installBtn">Install</button>
        <button class="btn-close" id="closeInstallBanner">✕</button>
    </div>

    <!-- ========== REST OF YOUR HTML ========== -->
    <nav class="sidebar" id="sidebar">
        <!-- ... your existing sidebar ... -->
    </nav>

    <main class="main-content">
        <!-- ... your existing content ... -->
    </main>

    <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
        <div class="modal">
            <button class="close" onclick="closeModal()">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- ========== UPDATED JAVASCRIPT ========== -->
    <script>
        // ... your existing App object and functions ...
        
        // ================================================================
        // PWA INSTALLATION FEATURE
        // ================================================================
        
        let deferredPrompt = null;
        let isAppInstalled = false;

        // Check if app is already installed
        if (window.matchMedia('(display-mode: standalone)').matches) {
            isAppInstalled = true;
            document.getElementById('installBanner').classList.remove('show');
        }

        // Listen for beforeinstallprompt event
        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent Chrome 67+ from automatically showing the prompt
            e.preventDefault();
            
            // Stash the event so it can be triggered later
            deferredPrompt = e;
            
            // Show the install banner
            const banner = document.getElementById('installBanner');
            if (!isAppInstalled) {
                banner.classList.add('show');
            }
        });

        // Install button click handler
        document.getElementById('installBtn').addEventListener('click', async () => {
            if (!deferredPrompt) {
                // If no deferred prompt, try to show the native prompt
                showToast('ℹ️', 'Tap the menu (3 dots) and select "Install App"', 'info');
                return;
            }
            
            // Show the install prompt
            deferredPrompt.prompt();
            
            // Wait for the user to respond to the prompt
            const result = await deferredPrompt.userChoice;
            
            if (result.outcome === 'accepted') {
                // User accepted the install
                isAppInstalled = true;
                document.getElementById('installBanner').classList.remove('show');
                showToast('✅ Installed', 'App installed successfully!', 'success');
            } else {
                // User dismissed the install
                showToast('ℹ️', 'You can install later from the browser menu', 'info');
            }
            
            // Clear the deferred prompt
            deferredPrompt = null;
        });

        // Close install banner
        document.getElementById('closeInstallBanner').addEventListener('click', () => {
            document.getElementById('installBanner').classList.remove('show');
        });

        // Listen for app installed event (Chrome)
        window.addEventListener('appinstalled', () => {
            isAppInstalled = true;
            document.getElementById('installBanner').classList.remove('show');
            showToast('🎉', 'App installed successfully!', 'success');
        });

        // ================================================================
        // SERVICE WORKER REGISTRATION
        // ================================================================
        
        if ('serviceWorker' in navigator) {
            // Register service worker
            navigator.serviceWorker.register('/sw.js')
                .then((registration) => {
                    console.log('✅ Service Worker registered successfully');
                    
                    // Check for updates
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        console.log('🔄 New Service Worker found');
                        
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                showToast('🔄 Update', 'New version available. Refresh to update.', 'info');
                            }
                        });
                    });
                })
                .catch((err) => {
                    console.log('❌ Service Worker registration failed:', err);
                });
            
            // Check if there's a waiting service worker
            navigator.serviceWorker.ready.then((registration) => {
                if (registration.waiting) {
                    // There's a waiting service worker, prompt user to update
                    showToast('🔄 Update', 'New version available. Click refresh to update.', 'info');
                }
            });
        }

        // ================================================================
        // PUSH NOTIFICATIONS (if supported)
        // ================================================================
        
        if ('Notification' in window && 'serviceWorker' in navigator) {
            // Request permission on user interaction
            document.addEventListener('click', () => {
                if (Notification.permission === 'default') {
                    Notification.requestPermission().then(permission => {
                        if (permission === 'granted') {
                            console.log('🔔 Push notifications enabled');
                        }
                    });
                }
            });
        }

        // ================================================================
        // OFFLINE STATUS INDICATOR
        // ================================================================
        
        window.addEventListener('online', () => {
            showToast('📶 Online', 'Connection restored. Refreshing data...', 'success');
            loadData();
        });
        
        window.addEventListener('offline', () => {
            showToast('📶 Offline', 'You are offline. Some features may not work.', 'error');
        });

        // Check initial online status
        if (!navigator.onLine) {
            setTimeout(() => {
                showToast('📶 Offline', 'You are offline. Data may not be up to date.', 'error');
            }, 1000);
        }

        // ================================================================
        // PWA INSTALL CHECK (for Chrome Android)
        // ================================================================
        
        // Check if already in standalone mode
        if (window.navigator.standalone) {
            // iOS Safari standalone
            isAppInstalled = true;
            document.getElementById('installBanner').classList.remove('show');
        }

        // For Android, check display mode via media query
        const displayMode = window.matchMedia('(display-mode: standalone)');
        displayMode.addEventListener('change', (e) => {
            if (e.matches) {
                isAppInstalled = true;
                document.getElementById('installBanner').classList.remove('show');
            }
        });

        console.log('📱 PWA Installation features loaded');
        console.log('📲 App installed:', isAppInstalled);
    </script>
</body>
</html>
